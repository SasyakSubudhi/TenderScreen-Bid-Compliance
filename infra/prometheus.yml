global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    static_configs: [{targets: ['api:8000']}]
  - job_name: workers
    dns_sd_configs:
      - names: [agent-worker, verification-worker]
        type: A
        port: 9100
  - job_name: stub
    static_configs: [{targets: ['provider-stub:8000']}]
  - job_name: resources
    static_configs: [{targets: ['resource-exporter:9100']}]
  - job_name: prometheus
    static_configs: [{targets: ['prometheus:9090']}]
  - job_name: grafana
    static_configs: [{targets: ['grafana:3000']}]
  - job_name: jaeger
    metrics_path: /metrics
    static_configs: [{targets: ['jaeger:14269']}]
