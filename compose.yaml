x-app: &app
  image: tenderscreen-app:local
  build: &app-build
    context: .
    network: ${BUILD_NETWORK:-default}
  env_file: .env
  restart: unless-stopped
  volumes:
    - corpus-data:/service/data
  depends_on:
    redis:
      condition: service_healthy
    provider-stub:
      condition: service_healthy
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  indexer:
    <<: *app
    restart: 'no'
    command: [python, -m, app.corpus]
  api:
    <<: *app
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    depends_on:
      redis: {condition: service_healthy}
      indexer: {condition: service_completed_successfully}
      provider-stub: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http' + '://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
  agent-worker:
    <<: *app
    command: [python, -m, app.worker]
    environment: {WORKER_ROLE: research, WORKER_METRICS_PORT: '9100'}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http' + '://127.0.0.1:9100/metrics',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  verification-worker:
    <<: *app
    command: [python, -m, app.worker]
    environment: {WORKER_ROLE: verification, WORKER_METRICS_PORT: '9100'}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http' + '://127.0.0.1:9100/metrics',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  provider-stub:
    restart: unless-stopped
    image: tenderscreen-app:local
    build: *app-build
    env_file: .env
    command: [python, -m, uvicorn, app.stub:app, --host, 0.0.0.0, --port, '8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http' + '://127.0.0.1:8000/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes: ['./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run configure first}
      GF_METRICS_ENABLED: 'true'
    volumes:
      - ./infra/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    restart: unless-stopped
    environment: {COLLECTOR_OTLP_ENABLED: 'true'}
    ports: ['127.0.0.1:16686:16686']
  resource-exporter:
    image: tenderscreen-app:local
    build: *app-build
    user: '0:0'
    restart: unless-stopped
    env_file: .env
    environment:
      PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-tenderscreen}
    command: [python, -m, app.resources]
    volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro']
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http' + '://127.0.0.1:9100/metrics',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  loadtest:
    <<: *app
    profiles: [test]
    command: [locust, -f, scripts/locustfile.py, --headless, --host, '${LOAD_HOST:-http://api:8000}', -u, '10', -r, '2', --run-time, 60s, --csv, /service/evidence/load]
    environment: {RATE_LIMIT: '100000'}
    volumes: ['./evidence:/service/evidence']
volumes:
  redis-data:
  corpus-data:
  grafana-data:
